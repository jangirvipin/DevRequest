name: Ci Pipeline

on:
  pull_request:
    branches:
      - Main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Build
        run: npm run build

      - name: Start the server
        run: npm start

      - name: Wait for the start of the server
        run: sleep 5

      - name: Check if server is running
        run: curl -f http://localhost:3000 || exit 1